name: Transcoder Service Checks

on:
  pull_request:
    paths:
      - "transcoder/**"
      - ".github/workflows/transcoder.yml"
  push:
    branches: [main]
    paths:
      - "transcoder/**"
      - ".github/workflows/transcoder.yml"

jobs:
  python-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: transcoder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: transcoder/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest -q
